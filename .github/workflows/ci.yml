name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"  # daily 6am UTC — seed crawl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies (all extras + dev)
        run: uv sync --all-extras --dev

      - name: Lint (flake8)
        run: uv run flake8 datasmith/ tests/ --max-line-length=100 --exclude=.venv --count

      - name: Test (pytest)
        run: uv run pytest tests/ -v --tb=short -q --cov=datasmith --cov-report=xml -Wignore::FutureWarning -Wignore::DeprecationWarning

      - name: Test importable
        run: uv run python -c "from datasmith.generation import generator, engine; from datasmith.imperfections import analyzer, injector, profiles; print('All modules importable')"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  seed-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.12
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure git
        run: |
          git config --local user.email "datasmith-bot@users.noreply.github.com"
          git config --local user.name "DataSmith Bot"

      - name: Run crawl + analyze
        run: uv run python scripts/crawl_and_analyze.py

      - name: Commit and push results
        run: |
          git add data/datasmith.db
          git diff --staged --quiet || git commit -m "daily seed crawl: $(date +%Y-%m-%d)"
          git push